name: Backup Database

# Nightly full backup of the Supabase database (Free plan has no restorable
# backups). Dumps with pg_dump 17, gzips, ENCRYPTS with a passphrase only
# Dylan knows, and keeps the encrypted file as a workflow artifact for 90
# days. This repo is public -- anyone signed in to GitHub can download
# artifacts -- so the dump must never be stored unencrypted.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL     Session pooler connection string (URI) from Supabase
#                       -> Connect. Free-plan direct connections are IPv6-only,
#                       which GitHub's runners can't reach.
#   BACKUP_PASSPHRASE   16+ characters, kept somewhere safe outside GitHub.
#                       Without it the backups can't be decrypted.
#
# Restore steps: docs/BACKUPS.md.

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC = 3 AM Central (CDT) / 2 AM (CST)
  workflow_dispatch: # "Run workflow" button for an on-demand backup

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets (see docs/BACKUPS.md)."
            exit 1
          fi
          if [ ${#BACKUP_PASSPHRASE} -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE must be at least 16 characters."
            exit 1
          fi

      - name: Dump, compress and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

          # pg_dump must match the server's major version (17).
          docker run --rm -e PGURL="$SUPABASE_DB_URL" postgres:17 \
            sh -c 'pg_dump "$PGURL"' > backup.sql

          SIZE=$(stat -c%s backup.sql)
          echo "Dump size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ] || ! grep -q "PostgreSQL database dump complete" backup.sql; then
            echo "::error::The dump is missing or incomplete."
            exit 1
          fi
          echo "Tables in dump: $(grep -c '^CREATE TABLE' backup.sql)"

          gzip -9 backup.sql
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "gigstaffpro-db-$STAMP.sql.gz.gpg" backup.sql.gz
          shred -u backup.sql.gz
          ls -l gigstaffpro-db-*.gpg

      - name: Keep the encrypted backup for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: gigstaffpro-db-${{ env.STAMP }}
          path: gigstaffpro-db-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
