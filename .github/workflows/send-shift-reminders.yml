name: Send Shift Reminders

on:
  schedule:
    # Run every hour at :10 past the hour
    - cron: '10 * * * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  send-shift-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send Shift Reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            https://gigstaffpro.vercel.app/api/send-shift-reminders)
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::send-shift-reminders returned HTTP $status"
            exit 1
          fi